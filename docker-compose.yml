services:
  postgres:
    image: postgres:16-alpine
    container_name: gupy_scraper_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gupy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gupy}
      POSTGRES_DB: ${POSTGRES_DB:-gupy_scraper}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gupy} -d ${POSTGRES_DB:-gupy_scraper}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: